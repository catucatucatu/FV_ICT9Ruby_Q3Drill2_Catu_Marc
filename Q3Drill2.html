<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q3 Drill 2</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.box{
		border: solid 1px black;
		background-color: lightcyan;
		border-radius: 15px;
	}

	#header{
		border-radius: 15px;
	}

	.ontoggle{
		text-align: center;
	}
	</style>
</head>
<body>
	<div class="box my-5 mx-5">
		<br>
		<div class="container bg-info" id="header">
			<h1 class="fw-bold text-center text-dark display-4" id="txt1"></h1>
		</div>
		<br>
		<details class="ontoggle">
			<summary>Instructions</summary>
			<p id="instruct"></p>
		</details>
		<br>

	<!-- <button type="button" class="btn btn-info text-dark" onclick="alert(dig1);">Answer</button>
	<button type="button" class="btn btn-info text-dark" onclick="document.write(dig1)">Answer</button>
	-->
	<form action="#">
		<div class="row">
			<div class="col-lg-11 mx-5">
		<label for="num1">Enter first number</label>
		<input type="number" id="num1" class="form-control" placeholder="Enter number" required>
			</div>
		</div>
		<br>

		<div class="row">
			<div class="col-lg-11 mx-5">
		<label for="num2">Enter second number</label>
		<input type="number" id="num2" class="form-control" placeholder="Enter number" required>
			</div>
		</div>
		<br>

		<div class="row">
			<div class="col-lg-11 mx-5">
		<label for="num3">Enter third number</label>
		<input type="number" id="num3" class="form-control" placeholder="Enter number" required>
			</div>
		</div>
		<br>

		<div class="row">
			<div class="col-lg-2 mx-5">
		<button type="submit" class="btn btn-info" onclick="calc()">Calculate</button>
			</div>
		</div>
		<br>
	</form>

	<script>
		var head = "Basic Calculator Version 2.0"; //assign string to calc
		document.getElementById('instruct').innerHTML="Enter a number and calculate the product";

		function calc(){
			var num1 = document.getElementById("num1").value;
			var num2 = document.getElementById("num2").value;
			var num3 = document.getElementById("num3").value;
			var prod = Number(num1) * Number(num2) * Number(num3);

			alert("The Product of The Numbers: " + prod + "\n" + "Thank you for trying my calculator!")
		}
		

		document.getElementById('txt1').innerHTML = head
	</script>
	</div>
</body>
</html>
